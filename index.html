<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message d'accueil — Villa CABOUA</title>
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="Accueil">
<meta name="theme-color" content="#d6543a">
<style>
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f7f3ee; margin:0; padding:18px;
         display:flex; justify-content:center; }
  .carte { background:#fff; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.10);
           padding:22px 20px 26px; width:100%; max-width:520px; }
  .logo { display:block; margin:0 auto 6px; width:110px; }
  h1 { color:#d6543a; font-size:1.15rem; margin:0 0 16px; text-align:center; }
  fieldset { border:1px solid #eadfd5; border-radius:12px; margin:0 0 14px; padding:12px 14px; }
  legend { color:#d6543a; font-weight:600; font-size:.92rem; padding:0 6px; }
  .ligne { display:flex; gap:10px; flex-wrap:wrap; }
  .champ { flex:1 1 130px; margin-bottom:8px; }
  label { display:block; font-size:.8rem; color:#666; margin-bottom:3px; }
  input, select { width:100%; padding:9px 10px; border:1px solid #ddcfc2; border-radius:8px;
                  font-size:1rem; background:#fff; }
  input:focus, select:focus { outline:2px solid #d6543a; border-color:#d6543a; }
  .radios { display:flex; gap:14px; align-items:center; padding-top:6px; }
  .radios label { font-size:.92rem; color:#333; display:flex; gap:5px; align-items:center; margin:0; }
  .radios input { width:auto; }
  .bulle { background:#e7f9d8; border-radius:14px; border-top-left-radius:4px;
           padding:14px 16px; margin:14px 0; font-size:.94rem; line-height:1.45;
           white-space:pre-wrap; color:#222; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .boutons { display:flex; gap:10px; }
  button { flex:1; border:none; border-radius:10px; padding:13px 8px; font-size:1rem;
           font-weight:600; cursor:pointer; }
  .copier { background:#d6543a; color:#fff; }
  .whatsapp { background:#25d366; color:#fff; }
  .ok { text-align:center; color:#1a7f37; font-size:.88rem; min-height:1.2em; margin-top:8px; }
  .opt-mediation { display:flex; gap:8px; align-items:center; font-size:.9rem; color:#444;
                   margin:2px 2px 4px; cursor:pointer; }
  .opt-mediation input { width:auto; }
  .opt-merci { display:flex; gap:8px; align-items:center; font-size:.95rem; color:#1a355e;
               font-weight:600; background:#fbf3e6; border:1px solid #f0dcbb; border-radius:10px;
               padding:10px 12px; margin:8px 0 4px; cursor:pointer; }
  .opt-merci input { width:auto; }
  #merciImg { display:none; width:100%; max-width:320px; margin:0 auto 12px; border-radius:12px;
              box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .partage { background:#25d366; color:#fff; }
</style>
</head>
<body>
<div class="carte">
  <img class="logo" src="logo.png" alt="Villa CABOUA">
  <h1>Message d'accueil — remise des clés</h1>

  <fieldset>
    <legend>Locataire</legend>
    <div class="ligne">
      <div class="champ"><label>Prénom</label><input id="prenom" placeholder="Natacha"></div>
      <div class="champ"><label>&nbsp;</label>
        <div class="radios">
          <label><input type="radio" name="genre" value="f" checked> Madame</label>
          <label><input type="radio" name="genre" value="h"> Monsieur</label>
        </div>
      </div>
    </div>
  </fieldset>

  <fieldset id="fieldsetArrivee">
    <legend>Arrivée</legend>
    <div class="ligne">
      <div class="champ"><label>Jour</label>
        <select id="jour">
          <option value="auj" selected>Aujourd'hui</option>
          <option value="dem">Demain</option>
          <option value="date">Autre date…</option>
        </select>
      </div>
      <div class="champ" id="champDate" style="display:none"><label>Date</label><input id="date" type="date"></div>
      <div class="champ" id="champHeure"><label>Heure de remise des clés</label><input id="heure" type="time" value="14:30"></div>
    </div>
  </fieldset>

  <label class="opt-mediation"><input type="checkbox" id="msgAccueil" checked> Accueil : remise des clés</label><label class="opt-mediation"><input type="checkbox" id="demandeHeure"> Demander l'heure d'arrivée</label><label class="opt-mediation">
    <input type="checkbox" id="msgDepart"> Départ : heure de libération
  </label>
  <label class="opt-merci">
    <input type="checkbox" id="msgRemerciements"> 💚 Remerciements (fin de séjour + avis Google)
  </label>

  <img id="merciImg" src="merci.jpg" alt="Carte Merci pour votre séjour — Villa CABOUA">

  <div class="bulle" id="apercu"></div>

  <div class="boutons">
    <button class="copier" onclick="copier()">📋 Copier</button>
    <button class="whatsapp" id="btnWhatsapp" onclick="whatsapp()">💬 WhatsApp</button>
    <button class="partage" id="btnPartage" onclick="partager()" style="display:none">📷 Photo + texte</button>
  </div>
  <div class="ok" id="ok"></div>
</div>

<script>
function construire() {
  const prenomBrut = document.getElementById('prenom').value.trim();
  const prenom = prenomBrut || '…';

  if (document.getElementById('msgRemerciements').checked) {
    return "Bonjour " + (prenomBrut ? prenomBrut + ' ' : '') + "😊\n\n"
      + "Un grand merci d'avoir choisi *la Villa CABOUA* pour votre séjour en Guadeloupe 🌿☀️\n\n"
      + "J'espère que vous avez passé un agréable moment et que vous garderez de beaux souvenirs de Bouillante.\n\n"
      + "Si le séjour vous a plu, un petit avis Google nous ferait énormément plaisir — et aiderait les prochains voyageurs à découvrir la villa ⭐\n\n"
      + "👉 https://g.page/r/Cf08pFSiKjt4EBM/review\n\n"
      + "Encore merci pour votre confiance, au plaisir de vous accueillir à nouveau 🌴\n\n"
      + "*Thierry*\nVilla CABOUA\ncaboua.github.io/guadeloupe";
  }

  const genre = document.querySelector('input[name="genre"]:checked').value;
  const jour = document.getElementById('jour').value;
  const h = document.getElementById('heure').value || '14:30';
  const heure = h.replace(':', 'h');

  let quand = "aujourd'hui", memeJour = true;
  if (jour === 'dem') { quand = 'demain'; memeJour = false; }
  else if (jour === 'date') {
    const v = document.getElementById('date').value;
    memeJour = false;
    if (v) {
      const dte = new Date(v + 'T12:00:00');
      quand = 'le ' + dte.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
      const auj = new Date();
      memeJour = dte.toDateString() === auj.toDateString();
    } else quand = 'le …';
  }

  const arrive = genre === 'f' ? 'arrivée' : 'arrivé'; if (document.getElementById('demandeHeure').checked) { const NL = String.fromCharCode(10); return "Bonjour " + prenom + "," + NL + "J'espère que vous allez bien 😊" + NL + NL + "Afin de pouvoir m'organiser au mieux pour votre accueil à la Villa CABOUA, pourriez-vous me dire vers quelle heure vous pensez arriver " + quand + " ?" + NL + NL + (memeJour ? "Merci et à tout à l'heure ! 🌺" : "Merci et à bientôt ! 🌺") + NL + "Thierry"; }
  if (document.getElementById('msgDepart').checked) { const NL2 = String.fromCharCode(10); const js = document.getElementById('jour').value; const salut = (js === 'auj') ? "Merci et à tout à l'heure," : (js === 'dem') ? "Merci et à demain," : "Merci et à bientôt,"; const soiree = (js === 'auj') ? "" : "Profitez bien de votre dernière soirée 😊" + NL2 + NL2; return "Bonjour " + prenom + " 😊," + NL2 + "J'espère que tout se passe bien et que vous avez passé un très agréable séjour à la Villa CABOUA 🌿☀️" + NL2 + NL2 + "Pourriez-vous simplement me dire vers quelle heure vous pensez quitter la villa " + quand + ", afin que nous puissions nous organiser pour la remise des clés ?" + NL2 + NL2 + soiree + salut + NL2 + "Thierry"; } const fin = memeJour ? "Au plaisir de vous accueillir à tout à l'heure 🌴" : "Au plaisir de vous accueillir 🌴";

  return "Bonjour " + prenom + "\nJ'espère que vous allez bien 😊\n\n"
    + "Comme convenu, je vous attends " + quand + " à " + heure + " pour la remise des clés.\n\n"
    + "Voici le point GPS de la villa pour vous y rendre facilement :\n"
    + "https://maps.app.goo.gl/TeLPYX3chBtjB63z6\n\n"
    + "Une fois " + arrive + " au point GPS, prenez le petit chemin sur votre droite : la villa est la 2ᵉ maison sur la gauche.\n\n"
    + "Le stationnement est prévu juste devant la villa, vous pourrez vous garer facilement à votre arrivée.\n\n"
    + "N'hésitez pas à me prévenir lorsque vous êtes en route ou en cas de léger retard.\n\n"
    + "Je reste bien entendu joignable si besoin.\n\n"
    + fin + "\nThierry";
}

function maj() {
  const rem = document.getElementById('msgRemerciements').checked;
  document.getElementById('fieldsetArrivee').style.display = rem ? 'none' : '';
  document.getElementById('merciImg').style.display = rem ? 'block' : 'none';
  document.getElementById('btnPartage').style.display = rem ? '' : 'none';
  document.getElementById('btnWhatsapp').style.display = rem ? 'none' : '';
  if (rem) majCarte();

  document.getElementById('champDate').style.display =
    document.getElementById('jour').value === 'date' ? '' : 'none'; document.getElementById('champHeure').style.display = (document.getElementById('demandeHeure').checked || document.getElementById('msgDepart').checked) ? 'none' : '';
  document.getElementById('apercu').textContent = construire();
  document.getElementById('ok').textContent = '';
}

async function copier() {
  const texte = construire();
  try { await navigator.clipboard.writeText(texte); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = texte; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  document.getElementById('ok').textContent = '✓ Message copié — collez-le dans WhatsApp';
}

function whatsapp() {
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(construire()), '_blank');
}

/* Carte personnalisée : on remplace « POUR VOTRE SÉJOUR » par le prénom du client */
var _carteBase = null;
function chargerCarteBase() {
  return new Promise(function (res, rej) {
    if (_carteBase) return res(_carteBase);
    var im = new Image();
    im.onload = function () { _carteBase = im; res(im); };
    im.onerror = rej;
    im.src = 'merci.jpg';
  });
}
async function genererCarte(prenom) {
  var im = await chargerCarteBase();
  var cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  var ctx = cv.getContext('2d');
  ctx.drawImage(im, 0, 0);
  if (prenom) {
    ctx.fillStyle = '#F8EADA';                 // crème échantillonné sur la carte
    ctx.fillRect(125, 436, 872, 52);           // masque « POUR VOTRE SÉJOUR »
    var nom = prenom.toUpperCase();
    var tracking = 15, size = 62;
    function largeur(s) {
      ctx.font = 'bold ' + s + 'px Georgia, "Times New Roman", serif';
      var w = 0; for (var i = 0; i < nom.length; i++) w += ctx.measureText(nom[i]).width;
      return w + tracking * (nom.length - 1);
    }
    while (largeur(size) > 860 && size > 26) size -= 2;
    ctx.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = '#1B433F';                 // vert échantillonné sur la carte
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var total = largeur(size), x = 561 - total / 2, cy = 463;
    for (var j = 0; j < nom.length; j++) {
      var w = ctx.measureText(nom[j]).width;
      ctx.fillText(nom[j], x + w / 2, cy);
      x += w + tracking;
    }
  }
  return cv;
}
async function majCarte() {
  try {
    var cv = await genererCarte(document.getElementById('prenom').value.trim());
    document.getElementById('merciImg').src = cv.toDataURL('image/jpeg', 0.92);
  } catch (e) {}
}

async function partager() {
  const texte = construire();
  const ok = document.getElementById('ok');
  try {
    const cv = await genererCarte(document.getElementById('prenom').value.trim());
    const blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', 0.92); });
    const file = new File([blob], 'merci-villa-caboua.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: texte });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(texte), '_blank');
  ok.textContent = "Partage direct indisponible : texte ouvert dans WhatsApp — enregistrez l'image ci-dessus (appui long) et joignez-la.";
}

document.querySelectorAll('input, select').forEach(e => {
  e.addEventListener('input', maj);
  e.addEventListener('change', maj);
});
var MSGS=['msgAccueil','demandeHeure','msgDepart','msgRemerciements']; MSGS.forEach(function(id){ document.getElementById(id).addEventListener('change', function(){ if(!this.checked){ this.checked=true; return; } MSGS.forEach(function(o){ if(o!==id) document.getElementById(o).checked=false; }); maj(); }); }); maj();
</script>
</body>
</html>
